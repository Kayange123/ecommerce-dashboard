version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
    ignore:
      # Prisma 7 dropped MongoDB support entirely; Prisma 8's MongoDB
      # support is a different query API and config model, not a drop-in
      # bump — see docs/rfcs/RFC-002-prisma-8-mongodb-migration.md. Stay
      # on the latest 6.x until that RFC is actually taken up.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # TypeScript 7's programmatic/Language Service API (what
      # @typescript-eslint and Next.js's own internal type-checking both
      # depend on) doesn't ship until 7.1 (~Nov 2026) — 7.0 is a native
      # Go-ported compiler with no JS-consumable API yet. Remove this
      # once 7.1 is out and this has actually been re-evaluated.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
