version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      radix-ui:
        patterns:
          - "@radix-ui/*"
    ignore:
      # Prisma 7 dropped MongoDB support entirely; Prisma 8's MongoDB
      # support is a different query API and config model, not a drop-in
      # bump — see docs/rfcs/RFC-002-prisma-8-mongodb-migration.md. Stay
      # on the latest 6.x until that RFC is actually taken up.
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      # TypeScript 7's programmatic/Language Service API (what
      # @typescript-eslint and Next.js's own internal type-checking both
      # depend on) doesn't ship until 7.1 (~Nov 2026) — 7.0 is a native
      # Go-ported compiler with no JS-consumable API yet. Remove this
      # once 7.1 is out and this has actually been re-evaluated.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # eslint-config-next@16.4.0 (latest as of writing) bundles
      # eslint-plugin-import@2.32.0, whose peer range caps at
      # `eslint: ^9` -- ESLint 10 genuinely doesn't install cleanly
      # under `npm ci` yet (confirmed the hard way: the individual PR's
      # own CI check passed, but `npm ci` against the combined lockfile
      # failed with ERESOLVE -- merged and had to be reverted). Remove
      # this once eslint-config-next bumps its own eslint-plugin-import
      # dependency.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Tailwind 4 is a full engine rewrite (CSS-first config, not
      # primarily tailwind.config.js-driven) -- a deliberate, scoped
      # future decision, not a routine bump. See CHANGELOG.md and
      # docs/audits/current-state.md. Remove once that work is actually
      # taken up.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # @tanstack/react-table v9 is a full API rewrite: useReactTable,
      # getCoreRowModel/getPaginationRowModel/getFilteredRowModel are gone,
      # ColumnDef's generic signature changed shape. Breaks every
      # components/*/Columns.tsx and components/ui/dataTable.tsx (confirmed
      # via a real CI typecheck failure on PR #40, closed rather than
      # merged). Needs a deliberate migration, not an auto-merge — see
      # docs/contributing/good-first-issues.md. Remove once that's done.
      - dependency-name: "@tanstack/react-table"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
