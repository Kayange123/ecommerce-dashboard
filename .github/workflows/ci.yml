name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: install → format → typecheck → lint → test → build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npx vitest run tests/unit --passWithNoTests

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        # @clerk/nextjs@6's ClerkProvider throws during page prerendering
        # if no publishableKey is present at all — this placeholder value
        # is not a real secret, just a well-formed key so the build
        # doesn't crash. It's never used to make a real Clerk API call in
        # CI. See Dockerfile for the same requirement at image build time.
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZmFrZS1rZXktZm9yLWJ1aWxkLnRlc3QuY2xlcmsuYWNjb3VudHMuZGV2JA
        run: npm run build
